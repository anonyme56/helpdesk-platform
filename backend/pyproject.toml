[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # Depends() dans les arguments est le style FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
