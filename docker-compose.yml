# Stack complète en local : front + back + worker + PostgreSQL + Redis + stockage objet + faux SMTP.
# Usage : bash scripts/gen-env.sh && docker compose up -d --build
name: helpdesk

x-backend-env: &backend-env
  ENV: dev
  DB_HOST: db
  DB_NAME: helpdesk
  DB_USER: helpdesk
  DB_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?}
  JWT_SECRET: ${JWT_SECRET:?}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet compatible S3 (pièces jointes, exports, sauvegardes).
  # SeaweedFS remplace MinIO, dont les images officielles ne sont plus publiées (voir rapport).
  s3:
    image: chrislusf/seaweedfs:4.54
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed mini -dir=/data -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"

  init:
    build:
      context: ./backend
      args: { APP_VERSION: compose }
    image: helpdesk/backend:dev
    command: ["python", "-m", "app.init_db"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: "no"

  backend:
    image: helpdesk/backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      args: { APP_VERSION: compose }
    image: helpdesk/worker:dev
    environment:
      <<: *backend-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: helpdesk/frontend:dev
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
