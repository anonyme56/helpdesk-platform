apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: helpdesk }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: helpdesk, helpdesk/tier: app }
    spec:
      serviceAccountName: worker
      enableServiceLinks: false   # sinon K8s injecte des variables du type S3_PORT=tcp://... qui polluent les applis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30   # laisse RQ finir la tâche en cours
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: helpdesk/worker
          ports:
            - { name: metrics, containerPort: 9100 }
          envFrom: [{ configMapRef: { name: helpdesk-config } }]
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: db-password } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: redis-password } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-access-key } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-secret-key } } }
            - { name: FILE_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: file-encryption-key } } }
          readinessProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
