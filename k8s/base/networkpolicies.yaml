# Réseau en "deny all" par défaut, puis ouverture flux par flux (A.8.20 / A.8.22 : cloisonnement réseau).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# l'Ingress controller (namespace traefik) peut joindre le front et l'API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [frontend, backend] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8000 }
---
# Prometheus (namespace monitoring) peut scraper l'API et le worker
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-prometheus-scrape }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [backend, worker] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9100 }
---
# sorties autorisées des pods applicatifs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: backend-egress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: backend }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: s3 } } }]
      ports: [{ protocol: TCP, port: 8333 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-egress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: worker }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: s3 } } }]
      ports: [{ protocol: TCP, port: 8333 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: mailpit } } }]
      ports: [{ protocol: TCP, port: 1025 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: backup-egress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: backup }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: s3 } } }]
      ports: [{ protocol: TCP, port: 8333 }]
---
# entrées autorisées vers les services de données : seulement ceux qui en ont besoin
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, worker, backup] }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: redis-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, worker] }
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: s3-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: s3 }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, worker, backup] }
      ports: [{ protocol: TCP, port: 8333 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mailpit-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: worker } } }]
      ports: [{ protocol: TCP, port: 1025 }]
