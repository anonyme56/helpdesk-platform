# Comptes de service dédiés, sans accès à l'API Kubernetes (aucun pod applicatif n'en a besoin).
apiVersion: v1
kind: ServiceAccount
metadata: { name: backend }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: data }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: backup }
automountServiceAccountToken: false
---
# Compte utilisé par la CI/CD pour déployer : uniquement ce qu'il faut dans CE namespace (A.5.15 / A.8.2)
apiVersion: v1
kind: ServiceAccount
metadata: { name: ci-deployer }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ci-deployer }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
  # volontairement absent : accès en lecture aux Secrets, suppression de ressources, exec dans les pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-deployer }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-deployer }
subjects:
  - { kind: ServiceAccount, name: ci-deployer }
---
# Lecture seule pour l'équipe d'exploitation (support de niveau 1) : pas de Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ops-readonly }
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "autoscaling"]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "deployments", "replicasets",
                "statefulsets", "jobs", "cronjobs", "ingresses", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ops-readonly }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ops-readonly }
subjects:
  - { kind: Group, name: helpdesk-ops, apiGroup: rbac.authorization.k8s.io }
