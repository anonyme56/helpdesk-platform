# Stockage objet compatible S3 (pièces jointes, exports, sauvegardes).
# Sur un vrai cloud, ce composant est remplacé par S3 / Blob Storage (voir terraform/aws) :
# le code applicatif ne change pas, seuls S3_ENDPOINT et les identifiants changent.
apiVersion: v1
kind: Service
metadata:
  name: s3
  labels: { app.kubernetes.io/name: s3, app.kubernetes.io/part-of: helpdesk }
spec:
  selector: { app.kubernetes.io/name: s3 }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  labels: { app.kubernetes.io/name: s3, app.kubernetes.io/part-of: helpdesk }
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: s3 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: s3, app.kubernetes.io/part-of: helpdesk, helpdesk/tier: data }
    spec:
      serviceAccountName: data
      enableServiceLinks: false   # sinon K8s injecte des variables du type S3_PORT=tcp://... qui polluent les applis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.54
          command: ["weed"]
          args: ["mini", "-dir=/data", "-s3.config=/etc/s3/s3.json"]
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/s3, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: s3-config
          secret: { secretName: s3-config }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
