apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk }
spec:
  selector: { app.kubernetes.io/name: backend, helpdesk/track: stable }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # jamais moins de pods prêts que demandé pendant une mise à jour
  selector:
    matchLabels: { app.kubernetes.io/name: backend, helpdesk/track: stable }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk, helpdesk/tier: app, helpdesk/track: stable }
    spec:
      serviceAccountName: backend
      enableServiceLinks: false   # sinon K8s injecte des variables du type S3_PORT=tcp://... qui polluent les applis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      # création des tables, de l'admin et des buckets avant de démarrer l'API (idempotent)
      initContainers:
        - name: init
          image: helpdesk/backend
          command: ["python", "-m", "app.init_db"]
          envFrom: [{ configMapRef: { name: helpdesk-config } }]
          env: &secret-env
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: db-password } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: redis-password } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-access-key } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-secret-key } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: jwt-secret } } }
            - { name: FILE_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: file-encryption-key } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: admin-password } } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext: &container-sec
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: backend
          image: helpdesk/backend
          ports:
            - { name: http, containerPort: 8000 }
          envFrom: [{ configMapRef: { name: helpdesk-config } }]
          env: *secret-env
          # laisse le temps à l'Ingress de retirer le pod de ses cibles avant l'arrêt (évite les 502 à la suppression)
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext: *container-sec
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
# Autoscaling horizontal : on ajoute des pods quand le CPU moyen dépasse 60 % de la requête
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
    scaleUp: { stabilizationWindowSeconds: 0 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
