# Dimensionnement des requests d'après la consommation MESUREE (scripts/finops-report.py, Prometheus, fenêtre 3 h) :
# les valeurs de la base visent la production ; dev/test consomment 2 à 4 fois moins.
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  template:
    spec:
      containers:
        - name: backend
          resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { memory: 384Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  template:
    spec:
      containers:
        - name: worker
          resources: { requests: { cpu: 30m, memory: 112Mi }, limits: { memory: 256Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  template:
    spec:
      containers:
        - name: nginx
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit }
spec:
  template:
    spec:
      containers:
        - name: mailpit
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 96Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources: { requests: { cpu: 40m, memory: 96Mi }, limits: { memory: 384Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis }
spec:
  template:
    spec:
      containers:
        - name: redis
          resources: { requests: { cpu: 20m, memory: 24Mi }, limits: { memory: 128Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: s3 }
spec:
  template:
    spec:
      containers:
        - name: seaweedfs
          resources: { requests: { cpu: 30m, memory: 208Mi }, limits: { memory: 768Mi } }
