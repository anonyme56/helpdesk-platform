# Déploiement canary de l'API : une nouvelle version reçoit une part du trafic (20 %) avant la bascule complète.
# Le Deployment "backend" reste la version stable ; Traefik répartit le trafic /api entre les deux Services.
#
#   sed 's/NAMESPACE/helpdesk-prod/;s/HOST/helpdesk.localtest.me/;s/TAG/v1.0.3/;s/WEIGHT_CANARY/20/;s/WEIGHT_STABLE/80/' \
#       k8s/canary/canary.yaml | kubectl apply -f -
# Promotion : mettre le tag dans l'overlay et déployer normalement, puis supprimer ces objets.
# Abandon   : kubectl delete -f k8s/canary/canary.yaml (le trafic repasse à 100 % sur la version stable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: NAMESPACE
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk, helpdesk/track: canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend, helpdesk/track: canary }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk, helpdesk/tier: app, helpdesk/track: canary }
    spec:
      serviceAccountName: backend
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: localhost:5001/helpdesk/backend:TAG
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: helpdesk-config } }]
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: db-password } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: redis-password } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-access-key } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: s3-secret-key } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: jwt-secret } } }
            - { name: FILE_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: file-encryption-key } } }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: NAMESPACE
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: helpdesk }
spec:
  selector: { app.kubernetes.io/name: backend, helpdesk/track: canary }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: backend-weighted
  namespace: NAMESPACE
spec:
  weighted:
    services:
      - { name: backend, port: 8000, weight: WEIGHT_STABLE }
      - { name: backend-canary, port: 8000, weight: WEIGHT_CANARY }
---
# priorité supérieure à celle de l'Ingress classique pour le chemin /api
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-canary
  namespace: NAMESPACE
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`HOST`) && PathPrefix(`/api`)
      kind: Rule
      priority: 1000
      services:
        - { name: backend-weighted, kind: TraefikService }
  tls: { secretName: helpdesk-tls }
