server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # sonde pour Kubernetes / compose
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # En compose, c'est nginx qui relaie l'API. Sous Kubernetes l'Ingress route /api
    # directement vers le Service backend avant d'arriver ici.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
