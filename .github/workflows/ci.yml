name: CI/CD

# Sur chaque push / pull request : lint -> tests -> analyse sécurité -> build + scan des images.
# Déploiement : automatique en dev (branche main), en prod sur tag vX.Y.Z avec validation manuelle.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------ qualité du code
  backend:
    name: Back-end (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt pip-audit
      - name: "Lint (ruff - style, bugs, règles de sécurité bandit)"
        run: ruff check .
      - name: Tests unitaires et couverture (seuil 80 %)
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80
      - name: Audit des dépendances (CVE connues)
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        with: { name: coverage-backend, path: backend/coverage.xml }

  worker:
    name: Worker (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "worker/requirements*.txt" }
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: pytest -q tests
      - run: pip-audit -r requirements.txt

  frontend:
    name: Front-end (lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------ sécurité et infrastructure
  secrets:
    name: Détection de secrets dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tout l'historique : un secret supprimé reste dans les anciens commits
      # Le CLI directement (et non gitleaks-action) : l'action calcule "premier commit du push ^..", ce qui echoue
      # au premier push d'un depot dont le premier commit n'a pas de parent. Ici on scanne tout l'historique.
      - name: Scan gitleaks de tout l'historique
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact -v

  iac:
    name: Infrastructure (Terraform, manifestes Kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.17.2" }
      - name: Terraform fmt + validate (local et AWS)
        run: |
          for d in terraform/local terraform/aws; do
            terraform -chdir=$d fmt -check -recursive
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: "Analyse de configuration (Trivy - Terraform, Kubernetes, Dockerfiles)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: "**/.terraform,frontend/node_modules"   # code tiers telecharge par terraform init
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Validation des manifestes (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev test prod; do
            kubectl kustomize k8s/overlays/$env | ./kubeconform -strict -ignore-missing-schemas -summary
          done

  # ------------------------------------------------------------------ images
  images:
    name: Image ${{ matrix.image }} (lint, build, scan, push)
    needs: [backend, worker, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        image: [backend, worker, frontend, backup]
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules (exigé par le registre)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Lint du Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: "${{ matrix.image }}/Dockerfile", failure-threshold: warning }
      - uses: docker/setup-buildx-action@v3
      - name: Tag d'image (sha court ; version si tag git)
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build (local, pour l'analyse)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          tags: "${{ env.REGISTRY }}/helpdesk/${{ matrix.image }}:${{ steps.meta.outputs.tag }}"
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan de vulnérabilités de l'image (Trivy) - bloque si CRITICAL/HIGH corrigeable
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/helpdesk/${{ matrix.image }}:${{ steps.meta.outputs.tag }}"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Connexion au registre (hors pull request)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push de l'image
        if: github.event_name != 'pull_request'
        run: docker push "${{ env.REGISTRY }}/helpdesk/${{ matrix.image }}:${{ steps.meta.outputs.tag }}"

  # ------------------------------------------------------------------ déploiement
  deploy-dev:
    name: Déploiement dev (rolling update)
    # ignore tant que la variable de depot DEPLOY_ENABLED n'est pas a 'true' (il faut un cluster joignable)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [images, iac, secrets]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Accès au cluster (kubeconfig du compte ci-deployer, droits limités au namespace)
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
      - name: Déploiement
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          scripts/deploy.sh dev "sha-${GITHUB_SHA::8}"
      - name: Test de fumée
        run: python scripts/smoke_test.py --base-url "${{ vars.DEV_URL }}" --admin-password "${{ secrets.DEV_ADMIN_PASSWORD }}"

  deploy-prod:
    name: Déploiement prod (rolling update + retour arrière automatique)
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: [images, iac, secrets]
    runs-on: ubuntu-latest
    environment: production   # protégé : validation manuelle d'un relecteur avant exécution
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
      - name: Déploiement
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          scripts/deploy.sh prod "${GITHUB_REF_NAME}"
      - name: Test de fumée
        run: python scripts/smoke_test.py --base-url "${{ vars.PROD_URL }}" --admin-password "${{ secrets.PROD_ADMIN_PASSWORD }}"
      - name: Retour arrière si le test échoue
        if: failure()
        run: |
          for d in backend worker frontend; do kubectl -n helpdesk-prod rollout undo deploy/$d; done
